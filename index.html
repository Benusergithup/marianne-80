<script>
(function(){
  "use strict";
  var D = JSON.parse(document.getElementById("daten").textContent);
  var SPEICHER = "marianne80-schluessel";
  var f = document.getElementById("f"), pw = document.getElementById("pw"), merk = document.getElementById("merk"),
      los = document.getElementById("los"), msg = document.getElementById("msg");
  function melden(t, fehler){ msg.textContent = t; msg.className = fehler ? "fehler" : ""; }
  function bytes(b64){ var s = atob(b64), u = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; }
  function b64(buf){ var u = new Uint8Array(buf), s = ""; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }
  function gemerkt(){ try { return localStorage.getItem(SPEICHER); } catch (e) { return null; } }
  function merken(v){ try { if (v) localStorage.setItem(SPEICHER, v); else localStorage.removeItem(SPEICHER); } catch (e) {} }
  if (!window.crypto || !window.crypto.subtle || !window.TextEncoder || !String.prototype.normalize) {
    melden("Dieser Browser kann die Seite nicht öffnen. Bitte in einem aktuellen Chrome, Safari oder Firefox versuchen.", true);
    los.disabled = true;
    return;
  }
  function ausPasswort(p){
    p = String(p || "").normalize("NFC").trim();
    return crypto.subtle.importKey("raw", new TextEncoder().encode(p), "PBKDF2", false, ["deriveBits"]).then(function(basis){
      return crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: bytes(D.salt), iterations: D.iter }, basis, 256);
    });
  }
  function oeffnen(roh, merkenJa){
    return crypto.subtle.importKey("raw", roh, "AES-GCM", false, ["decrypt"]).then(function(k){
      return crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(D.iv) }, k, bytes(D.ct));
    }).then(function(klar){
      if (merkenJa) merken(b64(roh));
      var html = new TextDecoder("utf-8").decode(klar);
      document.open();
      document.write(html);
      document.close();
    });
  }
  window.__ausPasswort = function(p){ return ausPasswort(p).then(b64); };
  function start(){
    var h = /(?:^#|&)pw=([^&]*)/.exec(location.hash || "");
    if (h) {
      try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
      melden("Öffne …");
      return Promise.resolve().then(function(){ return ausPasswort(decodeURIComponent(h[1])); })
        .then(function(roh){ return oeffnen(roh, true); })
        .catch(function(){ melden("Das Passwort im Link passt nicht. Bitte von Hand eingeben.", true); });
    }
    var g = gemerkt();
    if (g) {
      melden("Öffne …");
      return Promise.resolve().then(function(){ return oeffnen(bytes(g).buffer, false); })
        .catch(function(){ merken(null); melden("Das Passwort wurde geändert. Bitte das neue eingeben.", true); });
    }
  }
  f.addEventListener("submit", function(ev){
    ev.preventDefault();
    los.disabled = true;
    melden("Prüfe …");
    if (!merk.checked) merken(null);
    ausPasswort(pw.value).then(function(roh){ return oeffnen(roh, merk.checked); })
      .catch(function(){ los.disabled = false; melden("Das Passwort stimmt nicht.", true); pw.focus(); pw.select(); });
  });
  /* Erst nach dem Einlesen der Seite öffnen: Läuft document.write, solange der Parser noch arbeitet, hängt Chrome das
     Dashboard unter die Passwortseite, statt sie zu ersetzen (beobachtet 11.09.2026 beim gemerkten Schlüssel). */
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start); else start();
})();
</script>
